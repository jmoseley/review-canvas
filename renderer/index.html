<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Review Lens</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<div id="app" class="app">
			<!-- Intent band -->
			<header class="intent" id="intent">
				<div class="intent-main">
					<div class="intent-title">
						<span class="badge" id="base-badge">base…</span>
						<span class="totals" id="totals"></span>
					</div>
					<div class="intent-actions">
						<button id="btn-tour" class="btn primary">▶ Start guided tour</button>
						<button id="btn-refresh" class="btn ghost">Refresh</button>
						<button id="btn-base" class="btn ghost">Base…</button>
					</div>
				</div>
			</header>

			<!-- Body: rail + inspector -->
			<main class="body">
				<aside class="rail" id="rail">
					<div class="rail-scroll" id="rail-list"></div>
				</aside>

				<section class="inspector" id="inspector">
					<!-- Guided tour: docked step panel, sits above the diff -->
					<div class="tour" id="tour" hidden>
						<div class="tour-head">
							<span class="tour-progress" id="tour-progress"></span>
							<div class="tour-nav">
								<button id="tour-prev" class="btn ghost">‹ Prev</button>
								<button id="tour-next" class="btn">Next ›</button>
								<button id="tour-regen" class="btn ghost" title="Rebuild the tour from the current diff">⟳ Regenerate</button>
								<button id="tour-close" class="btn ghost">Exit tour</button>
							</div>
						</div>
						<div class="tour-body" id="tour-body"></div>
						<div class="tour-disposition" id="tour-disposition"></div>
					</div>
					<div class="diff-pane" id="diff-pane">
						<div class="inspector-empty" id="inspector-empty">
							Select a file or group, or start the guided tour.
						</div>
						<div class="diff" id="diff" hidden></div>
					</div>
				</section>
			</main>

			<!-- Chat dock -->
			<button id="chat-toggle" class="chat-toggle" aria-label="Open chat">💬</button>
			<div class="chat hidden" id="chat">
				<button type="button" class="chat-head" id="chat-head" aria-label="Hide chat" aria-expanded="false" title="Click to hide">
					<span>Ask the agent</span>
					<span class="chat-min" aria-hidden="true">▾</span>
				</button>
				<div class="chat-log" id="chat-log"></div>
				<form class="chat-form" id="chat-form">
					<input id="chat-input" placeholder="Ask about the focused step…" autocomplete="off" />
					<button class="btn" type="submit">Send</button>
				</form>
			</div>
		</div>
		<script src="/app.js" type="module"></script>
	</body>
</html>
